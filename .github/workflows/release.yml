name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify release versions
        id: version
        run: |
          VSCE_VERSION=$(node -p "require('./package.json').version")
          ZED_VERSION="${GITHUB_REF_NAME#v}"
          echo "vsce_version=$VSCE_VERSION" >> "$GITHUB_OUTPUT"
          echo "zed_version=$ZED_VERSION" >> "$GITHUB_OUTPUT"
          test -n "$VSCE_VERSION"
          test -n "$ZED_VERSION"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run encoding tests
        run: npm run test:encoding

      - name: Run formatter tests
        run: npm run test:formatter

      - name: Build Pawn language server
        run: |
          mkdir -p dist/zed-pawn
          npx esbuild src/server/server.ts --bundle --platform=node --target=node18 --outfile=dist/zed-pawn/pawn-language-server.js
          cp node_modules/astyle/dist/libastyle.wasm dist/zed-pawn/libastyle.wasm

      - name: Smoke test Pawn language server (Zed bundle)
        run: node tools/zed-bundle-smoke.cjs

      - name: Build VS Code extension
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx @vscode/vsce package --no-dependencies --no-yarn --out "release/pawn-forge-${VERSION}.vsix"

      - name: Build Zed extension WASM
        run: |
          rustup target add wasm32-wasip2
          cargo build --release --target wasm32-wasip2
          cp target/wasm32-wasip2/release/zed_pawn.wasm extension.wasm

      - name: Build Zed release bundle
        run: |
          VERSION="${{ steps.version.outputs.zed_version }}"
          mkdir -p dist/zed-extension/dist/zed-pawn
          cp extension.toml extension.wasm dist/zed-extension/
          cp -r languages grammars dist/zed-extension/
          cp icon.png LICENSE dist/zed-extension/
          cp -r tools dist/zed-extension/
          cp dist/zed-pawn/pawn-language-server.js dist/zed-extension/dist/zed-pawn/
          cp dist/zed-pawn/libastyle.wasm dist/zed-extension/dist/zed-pawn/
          cd dist/zed-extension
          zip -r "../../release/zed-pawn-${VERSION}.zip" .

      - name: Verify release assets
        run: |
          VSCE_VERSION="${{ steps.version.outputs.vsce_version }}"
          ZED_VERSION="${{ steps.version.outputs.zed_version }}"
          test -s "release/pawn-forge-${VSCE_VERSION}.vsix"
          test -s "release/zed-pawn-${ZED_VERSION}.zip"
          test -s dist/zed-pawn/pawn-language-server.js
          test -s dist/zed-pawn/libastyle.wasm
          test -s extension.wasm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/pawn-forge-${{ steps.version.outputs.vsce_version }}.vsix
            release/zed-pawn-${{ steps.version.outputs.zed_version }}.zip
            dist/zed-pawn/pawn-language-server.js
            dist/zed-pawn/libastyle.wasm
